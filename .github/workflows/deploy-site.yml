name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy site into the Pages artifact
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # 图标与截图在仓库根的 plugins/ 下，复制成站内相对路径
          mkdir -p _site/plugins
          for d in dsh-plugin-categorized dsh-watchman dsh-qq-panel; do
            mkdir -p "_site/plugins/$d"
            cp "plugins/$d/icon-180.png" "_site/plugins/$d/" 2>/dev/null || true
            if [ -d "plugins/$d/docs" ]; then
              mkdir -p "_site/plugins/$d/docs"
              cp "plugins/$d/docs/"*.png "_site/plugins/$d/docs/" 2>/dev/null || true
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
